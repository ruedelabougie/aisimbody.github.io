<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages 二维码</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .qrcode-container {
            margin: 30px 0;
        }
        .qrcode-container img {
            max-width: 100%;
            height: auto;
            border: 10px solid white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .url-info {
            margin: 20px 0;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 5px;
            word-break: break-all;
        }
        .instructions {
            margin: 30px 0;
            text-align: left;
            color: #666;
        }
        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .instructions ol {
            padding-left: 20px;
        }
        .instructions li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GitHub Pages 二维码</h1>
        
        <div class="qrcode-container">
            <!-- 直接使用Google Charts API生成的二维码图片 -->
            <img 
                src="https://chart.googleapis.com/chart?cht=qr&chs=300x300&choe=UTF-8&chld=H|1&chl=https://ruedelabougie.github.io/aisimbody.github.io" 
                alt="GitHub Pages 二维码"
                title="扫描访问：https://ruedelabougie.github.io/aisimbody.github.io"
            >
        </div>
        
        <div class="url-info">
            <strong>网址：</strong>
            <br>
            <a href="https://ruedelabougie.github.io/aisimbody.github.io" target="_blank">
                https://ruedelabougie.github.io/aisimbody.github.io
            </a>
        </div>
        
        <div class="instructions">
            <h3>使用说明：</h3>
            <ol>
                <li>使用手机或平板设备的相机扫描上方二维码</li>
                <li>或者右键点击二维码图片，选择"图片另存为..."保存到本地</li>
                <li>保存后可以将二维码用于文档、演示文稿或宣传材料中</li>
            </ol>
        </div>
        
        <p style="color: #666;">
            <strong>注意：</strong>此二维码指向您的GitHub Pages网站，确保您已经在GitHub上配置了GitHub Pages服务。
        </p>
    </div>
</body>
</html>
